name: rsa-voice-test
description: Run the RSA voice fast-path tests + cargo build
class: read
args:
  repo: {type: string, default: "/Users/roseonyema/Documents/code/idp"}
halt_on_failure: false
timeout: 120
steps:
  - name: pytest-voice
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      cd <<repo>>/backstage/plugins/fleetview-backend
      PYTHONPATH=src python3 -m pytest tests/test_rsa_module.py tests/test_rsa_voice_path.py -v --no-header 2>&1 | tail -40
      "
    timeout: 60
  - name: smoke-import
    cmd: |
      cd <<repo>>/backstage/plugins/fleetview-backend
      PYTHONPATH=src python3 -c "from fleetview_backend import voice; print('ok: voice module imports cleanly'); print('has rsa_fast_path:', hasattr(voice, 'rsa_fast_path'))"
    timeout: 10
  - name: rsa-build
    cmd: |
      cd <<repo>>/platform/rsa
      cargo build --workspace 2>&1 | tail -5
    timeout: 120
