name: graph-links
description: Update growmos graph with session links
steps:
  - name: link1
    cmd: >
      growmos --root ~/Documents/code/estate-graph link "estate_executor.py missing in main" "blocks" "executor daemon"
  - name: link2
    cmd: >
      growmos --root ~/Documents/code/estate-graph link "PR #4744" "restores" "estate_executor.py missing in main"
  - name: link3
    cmd: >
      growmos --root ~/Documents/code/estate-graph link "executor restored via PR #4744" "enables" "executor daemon"
  - name: link4
    cmd: >
      growmos --root ~/Documents/code/estate-graph link "estate_executor.py" "was in" "feat/pobr branch"
  - name: link5
    cmd: >
      growmos --root ~/Documents/code/estate-graph link "feat/pobr branch" "was deleted without merging" "estate_executor.py"
