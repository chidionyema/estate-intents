name: rsa-live
description: Start the live React panel server, return URL
class: mutate
args:
  apply:
    type: bool
    default: false
  port:
    type: number
    default: 4009
halt_on_failure: false
timeout: 60
steps:
  - name: start
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      pkill -9 -f serve-live.mjs 2>/dev/null
      sleep 1
      "
      cd /tmp/rsa-render
      nohup node serve-live.mjs >/tmp/live.log 2>&1 </dev/null &
      LPID=$!
      echo "candidate pid: $LPID"
      sleep 4
      lsof -nP -iTCP:<<port>> -sTCP:LISTEN 2>&1 | head -3
      cat /tmp/live.log
    timeout: 15
  - name: prove
    cmd: |
      CODE=$(curl -s -o /tmp/live-page.html -w "%{http_code}" -m 8 http://127.0.0.1:<<port>>/ 2>/dev/null || echo "0")
      SIZE=$(wc -c < /tmp/live-page.html 2>/dev/null || echo 0)
      HAS=$(grep -c 'rsa-status-panel\|1,041\|DRIFT DETECTED\|REGENERABLE\|drift 0' /tmp/live-page.html 2>/dev/null || echo 0)
      echo "==="
      echo "LIVE PANEL  http://localhost:<<port>>/"
      echo "==="
      echo "HTTP=$CODE  Size=$SIZE  LiveMarkersFound=$HAS"
      if [ "$HAS" -gt 0 ]; then
        echo "---FIRST 800 CHARS OF LIVE PAGE---"
        head -c 800 /tmp/live-page.html
      fi
    timeout: 15
