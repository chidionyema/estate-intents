name: rsa-estate-numbers-3
description: Per-top-dir line count, bounded, no full-repo walk.
class: mutate
args:
  apply:
    type: bool
    default: false
halt_on_failure: false
timeout: 90
steps:
  - name: top-dirs
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      cd /Users/roseonyema/Documents/code/idp
      echo "=== top-level directories ==="
      "
      ls -d */ 2>/dev/null
    timeout: 10
  - name: code-paths
    cmd: |
      cd /Users/roseonyema/Documents/code/idp
      echo "=== source-bearing paths (backstage, sovereign, platform, factory, tests) ==="
      for d in backstage sovereign platform factory tests; do
        if [ -d "$d" ]; then
          py=$(find "$d" -name '*.py' -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | wc -l)
          ts=$(find "$d" \( -name '*.ts' -o -name '*.tsx' \) -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | wc -l)
          rs=$(find "$d" -name '*.rs' -not -path '*/target/*' 2>/dev/null | wc -l)
          go=$(find "$d" -name '*.go' -not -path '*/node_modules/*' 2>/dev/null | wc -l)
          printf "  %-15s  py=%-6d ts=%-6d rs=%-6d go=%-6d\n" "$d" "$py" "$ts" "$rs" "$go"
        fi
      done
    timeout: 30
  - name: rsa-paths
    cmd: |
      cd /Users/roseonyema/Documents/code/idp
      echo "=== rsa-relevant paths only (fast — small scope) ==="
      find platform/rsa -type f \( -name '*.rs' -o -name '*.py' -o -name '*.proto' -o -name '*.yaml' \) -not -path '*/target/*' 2>/dev/null | xargs wc -l 2>/dev/null | tail -25
    timeout: 30
  - name: test-files
    cmd: |
      cd /Users/roseonyema/Documents/code/idp
      echo "=== python test files (small scope) ==="
      find backstage plugins sovereign tests -name 'test_*.py' -not -path '*/node_modules/*' 2>/dev/null | head -50
      echo
      echo "=== rust test files ==="
      find . -name 'tests' -type d -not -path '*/target/*' -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null
      find . -path '*/tests/*.rs' -not -path '*/target/*' -not -path '*/node_modules/*' 2>/dev/null
    timeout: 30
