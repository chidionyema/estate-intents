name: fix-both
description: Write minimal working workflows
halt_on_failure: false
steps:
  - cmd: "python3 - << 'PYEOF'\nimport os\n\npr_gate = \"\"\"# .github/workflows/mutation-pr-gate.yml\n# PR merge gate: blocks PR merge if mutation score < 80%.\nname: mutation-pr-gate\n\non:\n  pull_request:\n    types: [opened, synchronize, reopened]\n    paths:\n      - '**.py'\n      - '**.rs'\n      - '**.ts'\n      - '**.tsx'\n      - '**.go'\n      - '**.cs'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pull-requests: write\n\njobs:\n  mutation-pr:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n\n      - name: Install tools\n        run: pip install -q mutmut\n\n      - name: Install orchestrator\n        run: |\n          mkdir -p \"$HOME/.estate/bin\"\n          cp bin/mutation-orchestrator \"$HOME/.estate/bin/mutation-orchestrator\"\n          chmod +x \"$HOME/.estate/bin/mutation-orchestrator\"\n\n      - name: Get changed files\n        id: get-changed\n        run: |\n          BASE=\"${GITHUB_BASE_REF:-main}\"\n          CHANGED=$(git diff --name-only \"origin/$BASE...HEAD\" \\\n            | grep -E '.(py|rs|ts|tsx|go|cs)$' || true)\n          if [ -z \"$CHANGED\" ]; then\n            echo \"SKIP=no\" >> \"$GITHUB_OUTPUT\"\n          else\n            echo \"SKIP=no\" >> \"$GITHUB_OUTPUT\"\n            echo \"$CHANGED\" > /tmp/changed-files.txt\n          fi\n\n      - name: Run mutation testing\n        if: steps.get-changed.outputs.SKIP == 'no'\n        run: |\n          python3 \"$HOME/.estate/bin/mutation-orchestrator\" \\\n            --tier=pr --stdin --cwd=\"$PWD\" \\\n            < /tmp/changed-files.txt\n\n      - name: Gate decision\n        if: steps.get-changed.outputs.SKIP == 'no'\n        run: |\n          echo \"Mutation testing complete. If this step passed, score >= 80%.\"\n          echo \"If it failed, surviving mutants were found. Fix them before merging.\"\n\"\"\"\n\nnightly = \"\"\"# .github/workflows/mutation-nightly.yml\n# Runs mutation testing on the full codebase at 3am UTC every day.\nname: mutation-nightly\n\non:\n  schedule:\n    - cron: \"0 3 * * *\"\n  workflow_dispatch:\n\njobs:\n  mutation:\n    runs-on: ubuntu-latest\n    timeout-minutes: 120\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n\n      - name: Install tools\n        run: pip install -q mutmut\n\n      - name: Install orchestrator\n        run: |\n          mkdir -p \"$HOME/.estate/bin\"\n          cp bin/mutation-orchestrator \"$HOME/.estate/bin/mutation-orchestrator\"\n          chmod +x \"$HOME/.estate/bin/mutation-orchestrator\"\n\n      - name: Run mutation testing\n        run: |\n          python3 \"$HOME/.estate/bin/mutation-orchestrator\" \\\n            --tier=full --cwd=\"$PWD\"\n\"\"\"\n\nIDP = \"/Users/roseonyema/Documents/code/idp\"\nfor name, content in [(\"mutation-pr-gate.yml\", pr_gate), (\"mutation-nightly.yml\", nightly)]:\n    path = os.path.join(IDP, \".github/workflows\", name)\n    with open(path, \"w\") as f:\n        f.write(content.strip() + \"\\n\")\n    size = os.path.getsize(path)\n    print(f\"Written {size} bytes: {path}\")\nPYEOF"
