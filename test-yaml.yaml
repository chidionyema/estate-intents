name: test-yaml
description: Test YAML parsing approach
halt_on_failure: false
steps:
  - cmd: "python3 - << 'PYEOF'\nimport yaml\nimport tempfile, os\n\n# Test: simple heredoc-style script inside run: |\ntest_yaml = \"\"\"\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - name: write file\n        run: |\n          cat > /tmp/script.py << 'EOF'\nimport json\nprint('hello')\nEOF\n      - name: run it\n        run: python3 /tmp/script.py\n\"\"\"\n\n# Try parsing\ntry:\n    with tempfile.NamedTemporaryFile(suffix='.yml', delete=False) as f:\n        f.write(test_yaml.encode())\n        tmp = f.name\n    with open(tmp) as f:\n        d = yaml.safe_load(f)\n    os.unlink(tmp)\n    print('HEREDOC INSIDE BLOCK SCALAR: VALID YAML')\n    print('Content captured as literal string, not executed')\nexcept yaml.YAMLError as e:\n    print(f'HEREDOC INSIDE BLOCK SCALAR: INVALID - {e}')\n\n# Test: simple run block with python -c inline\ntest_yaml2 = \"\"\"\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - name: run inline python\n        run: |\n          python3 -c \"import json; print('hello')\"\n\"\"\"\n\ntry:\n    with tempfile.NamedTemporaryFile(suffix='.yml', delete=False) as f:\n        f.write(test_yaml2.encode())\n        tmp2 = f.name\n    with open(tmp2) as f:\n        d = yaml.safe_load(f)\n    os.unlink(tmp2)\n    print('INLINE PYTHON: VALID YAML')\nexcept yaml.YAMLError as e:\n    print(f'INLINE PYTHON: INVALID - {e}')\nPYEOF"
