name: sync-main
description: Preserve litellm-local, reset to origin/main, restore litellm-local
steps:
  - name: preserve
    cmd: >
      cp -r /Users/roseonyema/Documents/code/idp/litellm-local /tmp/litellm-local-backup 2>&1 && echo "preserved"
  - name: reset
    cmd: >
      cd /Users/roseonyema/Documents/code/idp && git fetch origin main && git reset --hard origin/main 2>&1 && echo "reset done"
  - name: restore
    cmd: >
      cp -r /tmp/litellm-local-backup/* /Users/roseonyema/Documents/code/idp/litellm-local/ 2>&1 && echo "restored"
  - name: status
    cmd: >
      ls /Users/roseonyema/Documents/code/idp/litellm-local/callbacks/ 2>&1
