name: rsa-news-channel-read
description: Read every reference to news, channel, alert, notify across idp
class: read
args: {}
halt_on_failure: false
timeout: 60
steps:
  - name: rg-news
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      echo "=== Files mentioning 'news' in idp ==="
      rg -l -i 'news' /Users/roseonyema/Documents/code/idp --type py --type js --type ts --type go --type yaml 2>&1 | head -30
      "
      echo
      echo "=== Files mentioning 'channel' in idp ==="
      rg -l 'channel' /Users/roseonyema/Documents/code/idp --type py --type ts --type go --type yaml 2>&1 | head -20
      echo
      echo "=== Files in platform/notify/ ==="
      ls /Users/roseonyema/Documents/code/idp/platform/notify/ 2>&1
      echo
      echo "=== Files in platform/alerts* ==="
      ls /Users/roseonyema/Documents/code/idp/platform/ 2>&1 | grep alert
      ls /Users/roseonyema/Documents/code/idp/platform/alerts-github 2>&1 | head
      ls /Users/roseonyema/Documents/code/idp/platform/alerts-secret 2>&1 | head
    timeout: 15
  - name: rg-detail
    cmd: |
      echo "=== notifications module ==="
      rg -l 'notification\|notify\|publish\|emit\|fanout' /Users/roseonyema/Documents/code/idp/platform/notify/ /Users/roseonyema/Documents/code/idp/sovereign/ 2>&1 | head -20
      echo
      echo "=== notify.py if any ==="
      cat /Users/roseonyema/Documents/code/idp/platform/notify/*.py 2>&1 | head -100
    timeout: 10
  - name: explain
    cmd: |
      # Read architecture docs around notifications
      echo "=== AGENTS.md notification section ==="
      grep -A 3 -i 'notification\|news' /Users/roseonyema/Documents/code/idp/AGENTS.md 2>&1 | head -40
      echo
      echo "=== sovereignty CONTRACT.md ==="
      grep -A 3 -i 'notification\|news\|alert' /Users/roseonyema/Documents/code/idp/sovereign/CONTRACT.md 2>&1 | head -30
    timeout: 10
