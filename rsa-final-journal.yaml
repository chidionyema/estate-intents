name: rsa-final-journal
description: Record the cleanup outcome in the growmos journal.
class: mutate
args:
  apply:
    type: bool
    default: false
halt_on_failure: false
timeout: 30
steps:
  - name: journal
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      cd /Users/roseonyema
      growmos --root Documents/code/estate-graph journal "RSA audit + cleanup complete. Removed: 9 ad-hoc docs (FLEET_PAGE_PROOF, INTEGRATION_STATUS, WHAT_THE_FOUNDER_SEES, BUYER_DEMO, VOICE_VISUAL_WIRING, ANSWER, PROOF.txt, PROOF.md, FLEET_INTEGRATION, WHA_IS_LIVE), scripts/render_panel.py, /tmp/ ad-hoc probes + node workspace + html/txt outputs, and the duplicate /voice/turns route in serve.py. Restored: _SPATIAL_PATTERN in voice.py after a regex cleanup ate it (caught by test_voice_spatial.py 13/13 PASS), and the catalogue import try/except that was orphaned by the same sweep. Deleted: test_rsa_voice_path.py (pinned rsa_fast_path which we removed). Code-review verdict: no regressions on voice.py / serve.py / routes.py. Pytest: 21/21 pass on test_rsa_module.py + test_voice_spatial.py. Cargo build was NOT re-run (60s ceiling risk); the Rust source under platform/rsa/ remains unchanged from earlier in the session. voice.py restored to its pre-session shape modulo the catalogue import being a real try/except over sovereign.voice.catalogue.RSA_PHRASES. Next step (separate session): rebuild the agent binary in cluster mode once executor is healthy."
      "
    timeout: 30
