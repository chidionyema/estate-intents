name: rsa-estate-numbers-2
description: Faster line count using find -exec instead of xargs cat.
class: mutate
args:
  apply:
    type: bool
    default: false
halt_on_failure: false
timeout: 60
steps:
  - name: count-by-ext
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      cd /Users/roseonyema/Documents/code/idp
      echo "=== source line counts (find -exec wc -l) ==="
      "
      for ext in py rs ts tsx go java rb sh yml yaml md; do
        result=$(find . -type f -name "*.$ext" -not -path '*/node_modules/*' -not -path '*/target/*' -not -path '*/.git/*' -not -path '*/dist/*' -not -path '*/build/*' -exec wc -l {} + 2>/dev/null | tail -1)
        printf "  %-6s  %s\n" ".$ext" "$result"
      done
    timeout: 60
  - name: count-tests
    cmd: |
      cd /Users/roseonyema/Documents/code/idp
      echo "=== python test files ==="
      find . -type f -name 'test_*.py' -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | wc -l
      echo "=== python test functions (def test_) ==="
      grep -rE '^[[:space:]]*def test_' --include='*.py' . 2>/dev/null | wc -l
      echo "=== integration tests (rust) ==="
      find . -type f -name 'tests' -path '*/src/*' -prune -o -type f -path '*/tests/*.rs' -print 2>/dev/null | wc -l
    timeout: 30
