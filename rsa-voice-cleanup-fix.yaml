name: rsa-voice-cleanup-fix
description: >
  Fix three residuals the previous cleanup left behind: an orphaned `except` clause,
  and two stale `_record_voice_turn` calls in the spatial paths. Same shape: bounded
  python3 regex substitutions against the file. Each substitution is anchored so the
  pre/post state is unambiguous.
class: mutate
args:
  apply:
    type: bool
    default: false
halt_on_failure: true
timeout: 30
steps:
  - name: preflight
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      cd /Users/roseonyema/Documents/code/idp
      F=backstage/plugins/fleetview-backend/src/fleetview_backend/voice.py
      "
      echo "=== before ==="
      grep -n -E "_record_voice_turn|_RSA_PHRASES_FALLBACK" "$F" || echo "(no remaining refs)"
    timeout: 10
  - name: fix-orphaned-except
    cmd: |
      python3 - <<'PY'
      from pathlib import Path
      f = Path("/Users/roseonyema/Documents/code/idp/backstage/plugins/fleetview-backend/src/fleetview_backend/voice.py")
      src = f.read_text()
      # The previous cleanup ate the `try:` block (and the catalogue import) but left
      # `except Exception: ... _RSA_PHRASES = _RSA_PHRASES_FALLBACK` dangling.
      # Restore the canonical catalogue-only structure: a single try/except wrapping
      # `from sovereign.voice.catalogue import RSA_PHRASES as _RSA_PHRASES`.
      orphan = (
          "\nexcept Exception:  # noqa: BLE001 - voice must not break if the catalogue is unreachable\n"
          "    _RSA_PHRASES = _RSA_PHRASES_FALLBACK\n"
          "\n\n"
      )
      if orphan not in src:
          print("FAIL: orphan block not found verbatim", file=sys.stderr if False else __import__('sys').stderr)
          raise SystemExit(1)
      restored = (
          "try:\n"
          "    from sovereign.voice.catalogue import RSA_PHRASES as _RSA_PHRASES  # noqa: E402\n"
          "except Exception:  # noqa: BLE001 - voice must not break if the catalogue is unreachable\n"
          "    _RSA_PHRASES = {}\n"
          "\n\n"
      )
      new = src.replace(orphan, restored, 1)
      assert new != src, "no replacement happened"
      f.write_text(new)
      print("OK orphaned except restored to canonical try/except over catalogue import")
      PY
    timeout: 10
  - name: fix-spatial-recorder-calls
    cmd: |
      python3 - <<'PY'
      from pathlib import Path
      f = Path("/Users/roseonyema/Documents/code/idp/backstage/plugins/fleetview-backend/src/fleetview_backend/voice.py")
      src = f.read_text()
      # Two calls inside the spatial intercepts in ask() and stream_ask(); delete
      # only the recorder line, keep the rest of the intercept intact.
      # ask():
      old1 = (
          "    spatial = spatial_fast_path(question)\n"
          "    if spatial is not None:\n"
          "        _record_voice_turn(question=question, body=spatial[0], status=spatial[1], rule=\"spatial-fast-path\")\n"
          "        return spatial\n"
      )
      new1 = (
          "    spatial = spatial_fast_path(question)\n"
          "    if spatial is not None:\n"
          "        return spatial\n"
      )
      assert src.count(old1) == 1, f"ask() pattern matches: {src.count(old1)}"
      src = src.replace(old1, new1, 1)

      # stream_ask():
      old2 = (
          "        yield _sse(\"answer\" if status == 200 else \"error\", body)\n"
          "        _record_voice_turn(question=question, body=body, status=status, rule=\"spatial-fast-path\")\n"
          "        yield _sse(\"done\", {\"status\": status})\n"
      )
      new2 = (
          "        yield _sse(\"answer\" if status == 200 else \"error\", body)\n"
          "        yield _sse(\"done\", {\"status\": status})\n"
      )
      assert src.count(old2) == 1, f"stream_ask() pattern matches: {src.count(old2)}"
      src = src.replace(old2, new2, 1)

      f.write_text(src)
      print("OK both spatial _record_voice_turn calls removed")
      PY
    timeout: 10
  - name: invariants
    cmd: |
      cd /Users/roseonyema/Documents/code/idp
      F=backstage/plugins/fleetview-backend/src/fleetview_backend/voice.py
      echo "=== remaining rsa_fast_path / _RSA_PHRASES_FALLBACK / _record_voice_turn references ==="
      if grep -nE "rsa_fast_path|_RSA_PHRASES_FALLBACK|_record_voice_turn" "$F"; then
        echo "FAIL: stale references remain"
        exit 1
      fi
      echo "OK zero stale references"
      echo
      echo "=== AST parse check (python3 -m py_compile) ==="
      python3 -m py_compile "$F" && echo "OK voice.py parses cleanly"
      echo
      echo "=== serve.py /voice/turns still gone ==="
      grep -n "/voice/turns" backstage/plugins/fleetview-backend/src/fleetview_backend/serve.py \
        || echo "OK /voice/turns not present"
      echo
      echo "=== catalogue.py RSA_PHRASES still canonical ==="
      grep -n "RSA_PHRASES = {" sovereign/voice/catalogue.py | head -3
    timeout: 15
