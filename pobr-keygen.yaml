name: pobr-keygen
description: Generate Ed25519 agent keypair for PoBR signing. Writes private key to ~/.estate/keys/agent.pem and public key to ~/.estate/keys/agent.pub.pem.

args:
  force:
    description: Overwrite existing keys.
    default: "false"

steps:
  - name: keygen
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      python3 - <<'PYEOF'
      import os, base64
      from cryptography.hazmat.primitives.asymmetric import ed25519
      from cryptography.hazmat.primitives import serialization
      from pathlib import Path

      key_dir = Path.home() / ".estate" / "keys"
      key_dir.mkdir(parents=True, exist_ok=True)
      priv_path = key_dir / "agent.pem"
      pub_path = key_dir / "agent.pub.pem"

      force = os.environ.get("force", "false").lower() == "true"
      if priv_path.exists() and not force:
          print(f"Keys already exist at {priv_path} (use force=true to overwrite)")
          print(f"Public key: {pub_path}")
      else:
          private_key = ed25519.Ed25519PrivateKey.generate()
          priv_bytes = private_key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption()
          )
          public_key = private_key.public_key()
          pub_bytes = public_key.public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo
          )
          priv_path.write_bytes(priv_bytes)
          pub_path.write_bytes(pub_bytes)
          priv_path.chmod(0o600)
          print(f"Wrote private key: {priv_path}")
          print(f"Wrote public key:  {pub_path}")
      PYEOF
