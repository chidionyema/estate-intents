name: rsa-voice-restore-spatial-pattern
description: >
  Restore _SPATIAL_PATTERN constant. Anchored on the function
  definition (more stable than the trailing dict).
class: mutate
args:
  apply:
    type: bool
    default: false
halt_on_failure: true
timeout: 30
steps:
  - name: restore-pattern
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      python3 - <<'PY'
      from pathlib import Path
      f = Path("/Users/roseonyema/Documents/code/idp/backstage/plugins/fleetview-backend/src/fleetview_backend/voice.py")
      src = f.read_text()
      anchor = 'def _is_spatial_intent(question: str) -> bool:\n    return bool(_SPATIAL_PATTERN.search(question or ""))\n'
      if anchor not in src:
          print("FAIL: anchor not found", file=__import__('sys').stderr)
          raise SystemExit(1)
      # Restored verbatim from the pre-session voice.py
      pattern = (
          '_SPATIAL_PATTERN = re.compile(\n'
          '    r"\\b("\n'
          '    r"the\\s+(?:one\\s+)?(?:on|in)\\s+the\\s+(?:left|right|back\\s+left|front\\s+right)|"\n'
          '    r"(?:leftmost|rightmost|topmost|bottommost)|"\n'
          '    r"the\\s+\\w+\\s+(?:one|from\\s+the\\s+(?:left|right))|"\n'
          '    r"the\\s+(?:first|second|third|fourth|fifth|last)"\n'
          '    r")\\b|"\n'
          '    r"\\bthe\\s+(red|green|blue|amber|grey|gray)\\s+(?:one)?\\b",\n'
          '    re.IGNORECASE,\n'
          ')\n'
          '\n'
      )
      replacement = pattern + anchor
      new = src.replace(anchor, replacement, 1)
      assert new != src
      f.write_text(new)
      print("OK _SPATIAL_PATTERN restored")
      PY
    timeout: 10
  - name: invariants
    cmd: |
      cd /Users/roseonyema/Documents/code/idp
      F=backstage/plugins/fleetview-backend/src/fleetview_backend/voice.py
      python3 -m py_compile "$F" && echo "OK voice.py parses cleanly"
      echo
      echo "=== _SPATIAL_PATTERN present? ==="
      grep -nE "_SPATIAL_PATTERN = re.compile|_is_spatial_intent" "$F"
      echo
      echo "=== run spatial detector tests ==="
      cd backstage/plugins/fleetview-backend
      PYTHONPATH=src python3 -m pytest tests/test_voice_spatial.py -v 2>&1 | tail -25
    timeout: 30
