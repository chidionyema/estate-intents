name: rsa-voice-cleanup-tests
description: >
  Delete test_rsa_voice_path.py (it pinned rsa_fast_path, which we removed in
  the previous cleanup). Run pytest on the remaining fleetview-backend tests
  to confirm nothing else broke. Bounded timeout, no cargo, no yarn.
class: mutate
args:
  apply:
    type: bool
    default: false
halt_on_failure: true
timeout: 60
steps:
  - name: remove-obsolete-test
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      rm -f /Users/roseonyema/Documents/code/idp/backstage/plugins/fleetview-backend/tests/test_rsa_voice_path.py
      echo "deleted test_rsa_voice_path.py"
      "
      ls /Users/roseonyema/Documents/code/idp/backstage/plugins/fleetview-backend/tests/
    timeout: 5
  - name: run-fleetview-backend-tests
    cmd: |
      cd /Users/roseonyema/Documents/code/idp/backstage/plugins/fleetview-backend
      PYTHONPATH=src python3 -m pytest tests/test_rsa_module.py tests/test_voice_spatial.py -v 2>&1 | tail -30
    timeout: 60
