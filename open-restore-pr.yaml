name: open-restore-pr
description: Open PR for executor restoration
steps:
  - name: write-body
    cmd: >
      printf '%s\n' \
        "## What" "" \
        "estate_executor.py was deleted in a7d721151 (PR #3956 consolidation)" \
        "but daemon.py still imports from it (CEILING_SEC, LocalExecutor," \
        "execute_command, read_job, simulate_command). PR #4731 (dc6ad2a66)" \
        "added an integrity guard to daemon.py that detects the missing file" \
        "and exits FATAL, but the file itself was never restored." \
        "" \
        "This commit restores the file from git history (last present at" \
        "366ccef70, parent of the consolidation commit)." \
        "" \
        "## Why" "" \
        "Without this file, the executor daemon cannot start." \
        "The integrity guard in daemon.py prevents a silent outage," \
        "but the daemon still cannot start at all." \
        "" \
        "## Verification" "" \
        "- Executor daemon starts with the file present" \
        "- Rollback: revert this commit to restore the FATAL-guarded state" \
        "" \
        "## CI" "" \
        "Expected to pass all gates - only addition of a deleted file." \
        > /tmp/pr-restore-executor.txt
  - name: open
    cmd: >
      cd /Users/roseonyema/Documents/code/idp && gh pr create \
        --title "restore(mcp/plugins): estate_executor.py - accidentally deleted" \
        --body-file /tmp/pr-restore-executor.txt \
        --base main \
        --head restore-executor \
        2>&1
