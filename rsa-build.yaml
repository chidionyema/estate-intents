name: rsa-build
description: >
  Build and test the RSA workspace. Proves the Regenerative Shadow Architecture
  compiles and tests pass.
class: read
args:
  repo: {type: string, default: "/Users/roseonyema/Documents/code/idp"}
halt_on_failure: false
timeout: 1800
steps:
  - name: cleanup-old-files
    cmd: |
      estate_invoke intent=pobr-gate 2>&1 | head -10
      bash -c "      cd <<repo>>/platform/rsa
      rm -f agent/src/wire_proxy.rs 2>/dev/null
      "
      rm -rf tests 2>/dev/null
      mkdir -p agent/tests
      # Fix type mismatches: replace HashMap with BTreeMap in test file
      sed -i.bak 's/HashMap/BTreeMap/g' agent/tests/rsa_test.rs 2>/dev/null
    timeout: 10
  - name: build-agent
    cmd: |
      cd <<repo>>/platform/rsa
      cargo build --package rsa-agent 2>&1
    timeout: 600
    on_fail: halt
  - name: build-verifier
    cmd: |
      cd <<repo>>/platform/rsa
      cargo build --package rsa-verifier 2>&1
    timeout: 600
    on_fail: halt
  - name: test-agent
    cmd: |
      cd <<repo>>/platform/rsa
      cargo test --workspace -- --nocapture 2>&1
    timeout: 600
    on_fail: halt
